default_language_version:
  python: python3.12
default_stages: [pre-commit]
default_install_hook_types: [pre-commit, prepare-commit-msg, commit-msg]
repos:
  # The pr-lint workflow rejects a PR title that is not a conventional commit, and
  # squash-merge uses the PR title as the commit message. Checking the same grammar
  # locally means the failure shows up before the push rather than in CI.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - --strict
          - feat
          - fix
          - perf
          - docs
          - refactor
          - revert
          - style
          - test
          - chore
          - ci
          - build
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude_types:
          - markdown
      - id: end-of-file-fixer
        exclude_types:
          - rust
      - id: check-yaml
        args: [--allow-multiple-documents]
      # `check-json` is deliberately absent: this crate has no tracked JSON, and
      # check-hooks-apply fails on a hook that matches nothing. Add it back alongside the
      # first JSON file.
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude_types:
          - batch
  - repo: https://github.com/executablebooks/mdformat
    rev: 0.7.22
    hooks:
      - id: mdformat
        language_version: python3
        additional_dependencies:
          - linkify-it-py==1.0.3
          - mdformat-gfm==0.3.5
  - repo: https://github.com/crate-ci/typos
    rev: v1.39.1
    hooks:
      - id: typos
        args: ["--config", ".typos.toml"]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.29.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/FeryET/pre-commit-rust
    rev: v1.2.1
    hooks:
      - id: fmt
      - id: cargo-check
  - repo: local
    hooks:
      # This repo provides no clippy hook, so it is local. `-D warnings` promotes anything
      # the Cargo.toml lint table leaves at warn level, and --all-targets means the lints
      # are enforced in tests too, not just the library.
      - id: clippy
        name: clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      # ---
      # Policy checks on the requirement set: the ID scheme and global uniqueness,
      # mandatory fields per type, permitted field values, the integrity-level ratchet,
      # the mandatory rationale on derived requirements, and that a transcribed
      # requirement records its source while a derived one does not.
      #
      # Complementary to the Sphinx build below rather than a substitute for it. Sphinx
      # validates directive syntax, link integrity and its own schema; this validates the
      # parts of the process Sphinx has no concept of. Stdlib only, so it needs no
      # environment and runs in milliseconds.
      # The policy checks are themselves guarded. Each check below must be demonstrated to
      # stop something; a guard rail is only verified by watching it fail.
      - id: validate-needs-tests
        name: validate_needs self-tests
        entry: python3 -m unittest discover --start-directory tools --pattern test_*.py
        language: system
        pass_filenames: false
        files: ^tools/.*\.py$
      - id: validate-needs
        name: validate requirement set
        entry: python3 tools/validate_needs.py
        language: system
        pass_filenames: false
        # `.md` is deliberately included even though this validates reStructuredText:
        # the check it runs reports a stray Markdown requirement document as a problem
        # (every requirement was Markdown before this branch, and README.md still is),
        # and that check cannot fire if the hook never sees the file. Do not "tidy"
        # this away.
        files: ^(docs/requirements/.*\.(rst|md)|tools/validate_needs\.py)$
      # The authoritative check that the requirement set is valid sphinx-needs: unknown
      # directives, ids that fail needs_id_regex, statuses outside needs_statuses, and
      # unresolved links are all errors here. Warnings are errors so that a requirement
      # excluded from every toctree cannot go unnoticed.
      - id: sphinx-needs
        name: sphinx-needs build
        entry: uv run --frozen sphinx-build -b needs -W -q docs docs/_build/needs
        language: system
        pass_filenames: false
        files: ^docs/.*\.(rst|py|md)$
