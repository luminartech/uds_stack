[package]
name = "uds_session"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "ISO 14229-2 session layer: a transport-agnostic, no_std, sans-io state machine for the client and server roles"
keywords = ["uds", "iso14229", "automotive", "diagnostics", "no-std"]
categories = ["no-std", "embedded", "network-programming"]
# Dual license at the consumer's option, the Rust ecosystem's convention: Apache-2.0 for
# its express patent grant, MIT for a downstream that cannot take Apache-2.0. The same
# license covers the requirement set under docs/. Neither license grants any right in the
# ISO standards the requirements cite, which remain ISO's; see "Relationship to the
# standards" in README.md.
license = "MIT OR Apache-2.0"
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[dependencies]

# Declared here rather than as inner attributes in lib.rs so that they apply to every
# target (lib, tests, examples and benches), not to the crate root alone.
[lints]
workspace = true
