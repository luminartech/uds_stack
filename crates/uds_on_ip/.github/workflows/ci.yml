# The rust-quality-gate suite. Five commands, run in order, every one of them
# reporting for itself — clippy cannot see formatting drift, an untested
# feature combination, or an undocumented public item.
name: CI

# Manual-only for now, and deliberately: every dependency in Cargo.toml is a
# path dependency on a sibling repository, so a checkout of this repo alone
# cannot resolve them and every automatic run would fail for a reason that has
# nothing to do with the change. Switch to `push`/`pull_request` in the same
# change that swaps the path deps for registry versions (ARCHITECTURE.md 8.4).
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: rustup component add rustfmt clippy

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -W clippy::pedantic

      - name: cargo test
        run: cargo test --locked

      # The manifest's dependency guards (tests/dependencies.rs) only prove
      # anything against the lockfile the build actually resolves, which is why
      # --locked is on the test and check runs rather than left to chance.
      - name: cargo hack check --feature-powerset
        run: |
          cargo install cargo-hack --locked
          cargo hack check --feature-powerset --no-dev-deps --locked

      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links -D missing_docs
        run: cargo doc --no-deps

  # no_std is not proven by --no-default-features on a hosted target: std can
  # still reach the build through a dependency. Only a *-none target proves it.
  bare_metal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add a bare-metal target
        run: rustup target add thumbv7em-none-eabihf
      - name: cargo check --target thumbv7em-none-eabihf
        run: cargo check --locked --target thumbv7em-none-eabihf
