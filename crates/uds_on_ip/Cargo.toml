[package]
name = "uds_on_ip"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "UDS on Internet Protocol (ISO 14229-5): the UDSonIP application profile and the transport mapping onto DoIP"
license = "MIT OR Apache-2.0"
repository = "https://github.com/luminartech/uds_stack"
readme = "README.md"
keywords = ["uds", "doip", "iso14229", "automotive", "diagnostics"]
categories = ["network-programming", "encoding"]
authors = [
    "Zachary Heylmun <zachary_heylmun@microvision.com>",
    "Justin Kovacich <justin_kovacich@microvision.com>",
]

[dependencies]
# Versions live in the workspace root's [workspace.dependencies]; this crate
# just points `path` at its siblings for the workspace build.
simple_doip = { workspace = true }
uds_protocol = { workspace = true }
uds_session = { workspace = true }

# The seam this crate sits below. uds_services declares UdsTransport and owns
# TransportEvent; this crate implements the first and returns the second, so
# both arrive from there rather than being mirrored here. The dependency arrow
# runs this way and only this way — uds_services never names a transport
# (UDSSVC_ARCH_0002), which is what keeps a binding additive at the application.
# It has no feature table, so nothing below forwards to it.
uds_services = { workspace = true }

# automotive-wire-codec is deliberately NOT a direct dependency. Its `Encode`
# and `Decode` are re-exported by simple_doip::messages, which is the crate
# this one is layered on, so the codec vocabulary arrives through the layer
# below rather than around it.

thiserror = { workspace = true }

[features]
# No runtime is named anywhere. An `async fn` implies neither std nor an
# executor, so the default build is no_std and a bare-metal target — AURIX
# TC4x is a qualification target — stays reachable. A runtime adapter, when
# one is written, is additive and lives behind its own feature.
default = []
alloc = ["simple_doip/alloc", "uds_protocol/alloc"]
std = ["alloc", "thiserror/std", "simple_doip/std", "uds_protocol/std"]
# simple_doip's connection service implementations, its Entity and Tester, in the
# same build. Nothing in this crate needs them; the loopback tests do, and they
# are the only thing it gates. A feature rather than a dev-dependency, so that a
# bare workspace build -- Miri's among them -- does not unify `connection` into
# simple_doip, as the workspace manifest's default-members note explains.
connection = ["simple_doip/connection"]

[[test]]
name = "sensor_path"
required-features = ["connection"]

[dev-dependencies]
# The sensor's path end to end over loopback (tests/sensor_path.rs and
# tests/loopback/): the real Entity and Tester on edge-nal-std sockets, behind
# the `connection` feature below. tokio drives the test only; it reaches no
# build of this crate.
edge-nal = { workspace = true }
edge-nal-std = { workspace = true }
# The same time driver simple_doip's tests use: a workspace test build links one.
embassy-time = { workspace = true, features = ["mock-driver", "generic-queue-8"] }
# mock-driver takes its lock through critical-section, which a host test supplies.
critical-section = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[lints]
workspace = true
