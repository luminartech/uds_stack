[package]
name = "uds_on_ip"
version = "0.2.0-alpha.1"
edition = "2024"
rust-version = "1.88"
description = "UDS on Internet Protocol (ISO 14229-5): the UDSonIP application profile and the transport mapping onto DoIP"
license = "MIT OR Apache-2.0"
repository = "https://github.com/luminartech/uds_on_ip"
readme = "README.md"
keywords = ["uds", "doip", "iso14229", "automotive", "diagnostics"]
categories = ["network-programming", "encoding"]
authors = [
    "Zachary Heylmun <zachary_heylmun@microvision.com>",
    "Justin Kovacich <justin_kovacich@microvision.com>",
]
exclude = ["legacy/", "docs/", ".github/"]

[dependencies]
# Path deps during the prototype. Swap to registry versions once simple_doip
# 0.5.x and uds_protocol 0.1.x are published; see ARCHITECTURE.md 8.4.
simple_doip = { path = "../simple_doip", default-features = false }
uds_protocol = { path = "../uds_protocol", default-features = false }
# ISO 14229-2 session layer vocabulary. This crate holds no addressing or
# service-primitive types of its own; see the boundary brief §2.
uds_session = { path = "../uds_session", default-features = false }

thiserror = { version = "2", default-features = false }
embedded-io = { version = "0.7", default-features = false }
tokio = { version = "1", features = ["rt", "time", "sync"], optional = true }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }

[features]
# The core (addressing, session seam, transport mapping, profile, handler seam)
# is no_std and alloc-free. Only the async drivers need std.
default = ["client"]
alloc = ["embedded-io/alloc", "simple_doip/alloc", "uds_protocol/alloc"]
std = ["alloc", "embedded-io/std", "thiserror/std", "simple_doip/std", "uds_protocol/std"]
client = ["std", "simple_doip/client", "dep:tokio", "dep:tracing"]
server = ["std", "simple_doip/server", "dep:tokio", "dep:tracing"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
