[default.extend-words]
# ISO 14229-2 terminology. The standard's own vocabulary is used deliberately — it is what
# makes the private clause mapping mechanical — so a few of its abbreviations need to be
# allowed through.
#
# Add entries only when typos actually objects to one. An exception list padded with terms
# that were never flagged hides which ones are load-bearing, and quietly widens the set of
# real misspellings the checker will accept.

# StartOfMessage, as in the T_DataSOM.ind transport primitive.
SOM = "SOM"
