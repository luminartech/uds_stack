[package]
name = "uds_services"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "ISO 14229-1 behavior: typed UDS service dispatch over caller-defined identifiers, and the clause 8.7 server response implementation rules"
license = "MIT OR Apache-2.0"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["uds", "iso14229", "automotive", "diagnostics", "no-std"]
categories = ["no-std", "embedded", "network-programming"]

[dependencies]
# L1 message codec. This crate dispatches over uds_protocol's message types and
# never re-encodes them itself.
uds_protocol = { workspace = true }

# ISO 14229-2 session layer. This crate owns a Server<PEERS> by value and drives
# it (UDSSVC_ARCH_0040), and speaks its vocabulary on the transport seam.
uds_session = { workspace = true }

# The I/O vocabulary for the whole stack. Sink is what a handler writes into.
automotive-wire-codec = { workspace = true }

# No [features] table. This crate is no_std and allocation-free in every
# configuration, and nothing in src/ reads a cfg. An application enables uds_protocol's
# `alloc` and `std` on its own dependency, which its handlers already have.
#
# No binding is a dependency either: UDSSVC_ARCH_0002 points the dependency arrow one
# way and UDSSVC_ARCH_0003 makes bindings additive at the application. No runtime is
# named (UDSSVC_ARCH_0030).

[dev-dependencies]
# The in-place `static` pattern the docs show for a server: `ConstStaticCell` yields
# the `&'static mut` that `Server::step` needs without a stack temporary.
static_cell = { workspace = true }

[lints]
workspace = true
