[package]
name = "simple_doip"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = "0.3"
thiserror = "1"
tokio = { version = "1", optional = true, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "time",
] }
async-trait = "0.1"
bytes = "1"
byteorder = "1"
strum = { version = "0.24", features = ["derive"] }
tokio-util = { version = "0.7", optional = true, features = [
    "net",
    "codec",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[dev-dependencies]
anyhow = "1"

[features]
default = ["client", "server"]
codec = ["dep:tokio", "dep:tokio-util"]
client = ["codec"]
server = ["codec"]
