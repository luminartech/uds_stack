[package]
name = "simple_doip"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "An ISO 13400-2 (DoIP) implementation with a no_std, zero-copy protocol core and optional async client and server"
license = "MIT OR Apache-2.0"
repository = "https://github.com/luminartech/uds_stack"
readme = "README.md"
keywords = ["doip", "iso13400", "automotive", "diagnostics", "no-std"]
categories = ["network-programming", "embedded", "no-std"]
# Editor scratch an editor may recreate locally. Everything else that used to
# be listed here -- docs/, .github/, release-plz.toml, rust-toolchain.toml --
# moved to the workspace root in the consolidation and can no longer appear
# under this crate at all.
exclude = [".vscode/"]

# `default = []`, so docs.rs would otherwise build the no_std core alone and
# publish a reference with no `client`, `server`, `codec`, `alloc` or `std`
# API in it -- most of what the README points a reader at. Every feature is
# additive, so all of them can be on at once.
[package.metadata.docs.rs]
all-features = true

[dependencies]
automotive-wire-codec = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true, optional = true }
# std-only, all optional
async-trait = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "time",
] }
tokio-util = { workspace = true, optional = true }

[dev-dependencies]
anyhow = { workspace = true }
proptest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
tracing-subscriber = { workspace = true }

[features]
default = []
alloc = []
std = ["alloc", "thiserror/std", "dep:tracing", "tracing/std"]
codec = ["std", "dep:tokio", "dep:tokio-util", "dep:bytes"]
client = ["codec", "dep:async-trait", "dep:futures"]
server = ["codec", "dep:async-trait", "dep:futures"]

[[test]]
name = "golden_vectors"

[[test]]
name = "integration_test"
required-features = ["client", "server"]

[[test]]
name = "udp_identification"
required-features = ["server"]

[[example]]
name = "simple_client"
required-features = ["client"]

[[example]]
name = "echo_server"
required-features = ["server"]

[lints]
workspace = true
