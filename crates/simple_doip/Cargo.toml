[package]
name = "doip"
version = "0.1.0"
edition = "2021"

[dependencies]

async-trait = "0.1"
bincode = "1"
bytes = "1"
byteorder = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
tokio = { version = "1", optional = true, features = ["net"] }
tokio-native-tls = { version = "0.3", optional = true }

[features]
default = ["client", "server", "tls"]
client = ["dep:tokio"]
server = ["dep:tokio"]
tls = ["dep:tokio-native-tls"]
