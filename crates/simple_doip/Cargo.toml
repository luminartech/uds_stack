[package]
name = "doip"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror.workspace = true
tokio = { workspace = true, optional = true, features = ["time"] }

async-trait = "0.1"
bytes = "1"
byteorder = "1"
futures = "0.3"
tokio-util = { version = "0.7.12", optional = true, features = [
    "net",
    "codec",
] }

[dev-dependencies]
anyhow = "1"


[features]
default = ["client", "server"]
codec = ["dep:tokio", "dep:tokio-util"]
client = ["codec"]
server = ["codec"]
