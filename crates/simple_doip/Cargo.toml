[package]
name = "doip"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
byteorder = "1"
futures = "0.3"
thiserror = "1"
tokio = { version = "1", optional = true, features = [
    "macros",
    "net",
    "rt-multi-thread",
] }
tokio-util = { version = "0.7", optional = true, features = ["net", "codec"] }

[features]
default = ["client", "server"]
codec = ["dep:tokio", "dep:tokio-util"]
client = ["codec"]
server = ["codec"]
