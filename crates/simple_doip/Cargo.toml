[package]
name = "simple_doip"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "An ISO 13400-2 (DoIP) implementation with a no_std, zero-copy protocol core, and a no_std tester and entity"
license = "MIT OR Apache-2.0"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["doip", "iso13400", "automotive", "diagnostics", "no-std"]
categories = ["network-programming", "embedded", "no-std"]
# Editor scratch an editor may recreate locally.
exclude = [".vscode/"]

# `default = []`, so docs.rs would otherwise build the no_std core alone and
# publish a reference with no `connection`, `codec`, `alloc` or `std`
# API in it -- most of what the README points a reader at. Every feature is
# additive, so all of them can be on at once.
[package.metadata.docs.rs]
all-features = true

[dependencies]
automotive-wire-codec = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
# the `codec` feature, std
bytes = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
# the `connection` feature, no_std
edge-nal = { workspace = true, optional = true }
embedded-io-async = { workspace = true, optional = true }
embassy-time = { workspace = true, optional = true }
embassy-futures = { workspace = true, optional = true }

[dev-dependencies]
anyhow = { workspace = true }
proptest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
edge-nal-std = { workspace = true }
embassy-time = { workspace = true, features = ["mock-driver", "generic-queue-8"] }
# mock-driver takes its lock through critical-section, which a host test must supply
critical-section = { workspace = true, features = ["std"] }

[features]
default = []
alloc = []
std = ["alloc"]
codec = ["std", "dep:tokio-util", "dep:bytes", "dep:tracing"]
connection = [
    "dep:edge-nal",
    "dep:embedded-io-async",
    "dep:embassy-time",
    "dep:embassy-futures",
]

[[test]]
name = "golden_vectors"

[[test]]
name = "tester"
required-features = ["connection"]

[[test]]
name = "entity"
required-features = ["connection"]

[[test]]
name = "entity_cancel"
required-features = ["connection"]

[[test]]
name = "entity_udp"
required-features = ["connection"]

[[test]]
name = "tester_udp"
required-features = ["connection"]

[[test]]
name = "mock_stack"
required-features = ["connection"]

[[test]]
name = "entity_std"
required-features = ["connection"]

[[test]]
name = "entity_interop"
required-features = ["connection", "codec"]

[[test]]
name = "tester_late_ack"
required-features = ["connection"]

[lints]
workspace = true
