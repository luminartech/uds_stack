[package]
name = "uds_protocol-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
automotive-wire-codec = { version = "0.4", default-features = false }
libfuzzer-sys = "0.4"
uds_protocol = { path = ".." }

[[bin]]
name = "fuzz_request_decode"
path = "fuzz_targets/fuzz_request_decode.rs"
doc = false

[[bin]]
name = "fuzz_response_decode"
path = "fuzz_targets/fuzz_response_decode.rs"
doc = false

[[bin]]
name = "fuzz_roundtrip"
path = "fuzz_targets/fuzz_roundtrip.rs"
doc = false

# Its own workspace: the fuzz crate must not be built by, or share a lockfile
# with, the library it fuzzes. Without this, cargo absorbs it into the stack
# workspace, where it is not a member, and refuses to resolve anything.
[workspace]
members = ["."]
