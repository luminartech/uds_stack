# Cargo.toml
[workspace]
resolver = "3"
members = ["crates/*"]

# The stack's version. The five crates release in lockstep, so the version is declared once
# and every crate inherits it with `version.workspace = true`; release-plz bumps this line
# and all five move together. See release-plz.toml.
[workspace.package]
version = "0.7.0"
# One MSRV for the whole stack, so CI runs one MSRV check. It is the highest MSRV of any
# dependency the host build faces: edge-nal 0.7's 1.88, which simple_doip's connection
# service will take. A bare-metal integrator's own choices (edge-nal-embassy needs 1.91)
# do not set it.
rust-version = "1.88"

# Shared dependency versions. Declared once so a bump is one edit, and so the five
# crates cannot silently drift onto different majors of the same library.
#
# The inter-crate entries carry BOTH `path` and `version`. `path` is what makes a
# workspace build use the source next door; `version` is what a published crate's
# consumer resolves from crates.io. Cargo strips `path` when packaging, so omitting
# `version` would publish a dependency with no version requirement, which the registry
# rejects. Their `version` is always the workspace version above; release-plz updates both.
[workspace.dependencies]
uds_protocol = { path = "crates/uds_protocol", version = "0.7.0", default-features = false }
uds_session = { path = "crates/uds_session", version = "0.7.0", default-features = false }
uds_services = { path = "crates/uds_services", version = "0.7.0", default-features = false }
simple_doip = { path = "crates/simple_doip", version = "0.7.0", default-features = false }

# External. `automotive-wire-codec` is deliberately NOT a workspace member: it serves
# simple_someip as well and is released on its own cadence.
automotive-wire-codec = { version = "0.4", default-features = false }
bitmask-enum = "2"
thiserror = { version = "2", default-features = false }
strum = { version = "0.27", default-features = false, features = ["derive"] }
tracing = { version = "0.1", default-features = false }
async-trait = "0.1"
bytes = "1"
futures = "0.3"
tokio = "1"
tokio-util = { version = "0.7", features = ["net", "codec"] }
serde = { version = "1", default-features = false, features = ["derive"] }
utoipa = "5"
clap = { version = "4", features = ["derive"] }
# The stack's one clock (simple_doip::service's contract). A time abstraction, not a
# runtime: the integrator links a time driver for the target.
embassy-time = "0.5"

# dev-dependencies
anyhow = "1"
static_cell = "2"
critical-section = "1"
proptest = "1"
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

# One quality standard for every crate here, declared once. A crate opts in with
# `[lints] workspace = true`, and Cargo forbids a crate from inheriting this table
# *and* adding to it -- "cannot override `workspace.lints` in `lints`" -- so this is
# the whole policy, and a crate that needs more or less says so as a crate-root
# attribute in its own lib.rs, where a reader opening the file sees it. Each such
# derogation carries a reason and a count, so the gap is reportable rather than tacit.
#
# Declared here rather than as inner attributes so the lints apply to every target --
# lib, tests, examples, benches -- instead of only to the crate root. A guard rail
# that stops at the test boundary is not a guard rail.
[workspace.lints.rust]
# `forbid`, not `deny`: deny can be switched off locally with an `allow`, forbid
# cannot, which is the point. Scope it honestly -- this forbids `unsafe` in these
# crates' own sources. Dependencies, `core` included, are unaffected and are covered
# separately by dependency review.
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[workspace.lints.clippy]
# Negative priority so the specific lints below can override members of the group.
pedantic = { level = "deny", priority = -1 }

# --- Panic freedom ---------------------------------------------------------------
# A panic in a diagnostic stack is an unhandled failure in a safety-related
# component, and every byte these crates decode is attacker-supplied. `deny` rather
# than `forbid`: a local `allow` carrying a reviewed justification is a legitimate
# outcome, silently reaching for `unwrap` is not. `todo` is denied for the same
# reason it is expected at each stub site -- the attribute is the record that a body
# is outstanding, and it stops being free the moment the lint is off.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"

# --- Defensive -------------------------------------------------------------------
# Buffer offsets and message lengths are this stack's arithmetic, and the same
# sources build for a 32-bit bare-metal target where a silently truncating cast is a
# portability defect host tests will not catch. A panicking index on wire-derived
# data is a denial of service.
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
