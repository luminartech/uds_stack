# Thin caller for the org-wide reusable Rust CI workflow. This file owns the triggers and
# repo-specific configuration; luminartech/rust_workflow owns most of the jobs: pre-commit,
# lint, build, no_std canary, unit/property tests with coverage, miri, MSRV, semver-checks,
# security audit, docs, a publish dry run, and the release-plz automation.
#
# rust-ci.yml's commands are crate-shaped (no `--workspace`, no `package`/`members` input).
# This is a *virtual* workspace manifest (no root [package]), so a bare `cargo <cmd>` with
# no `-p` at the root runs on its default members, `crates/*`: the five crates. The
# example member, examples/embassy-net-entity, is built by the hand-rolled `embedded` job
# below instead; see the root Cargo.toml for why it is not a default member. The one job the
# reusable workflow genuinely cannot reach is fuzzing: its fuzz-tests job runs
# `cargo fuzz build`/`list`/`run` at the checkout root, which is where a single-crate repo's
# `fuzz/` directory lives, and has no input to point it elsewhere. This workspace's two fuzz
# targets live under crates/simple_doip/fuzz and crates/uds_protocol/fuzz instead, so
# run-fuzz-tests is disabled below and replaced with the two hand-rolled jobs at the bottom
# of this file. See task-14b-report.md for the rust_workflow change (a `fuzz-directory`
# input) that would let this move back into the reusable workflow.
name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      enable-comprehensive-tests:
        description: 'Run comprehensive test suites (longer fuzz, miri)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    uses: luminartech/rust_workflow/.github/workflows/rust-ci.yml@v1
    # The reusable workflow's test jobs downscope themselves to contents: read; this grant
    # is only used by the release-plz jobs (release PR + tag/GitHub-release publish).
    permissions:
      contents: write
      pull-requests: write
    secrets:
      cargo-registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      release-plz-app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
      release-plz-app-private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
    with:
      # Restrict publishing/release-plz to the canonical repo so a fork never publishes.
      publish-repository: luminartech/uds_stack
      # HOLD. Nothing is released until the stack's functionality has been verified. These
      # two inputs gate every job in rust-ci.yml that can publish, tag or cut a GitHub
      # release: release-plz-pr and release-plz-release run only with use-release-plz, and
      # the tag-gated release job only with publish-crate. With both off, a push to main
      # runs the checks and nothing else, whatever secrets the repository holds.
      #
      # The hold lives here, not in release-plz.toml, because release-plz's own switch
      # (`release = false`) turns "nothing to release" into an error that fails both
      # release jobs on every push.
      #
      # Lifting it is its own reviewed pull request: set use-release-plz to true (leave
      # publish-crate false; release-plz owns publishing), add each crate's changelog entry
      # for the release, delete the hand-rolled `release-pr` job at the bottom of this file
      # (rust-ci.yml's own release-plz-pr replaces it), and add the release-plz App as the
      # bypass actor in .github/rulesets/release-tags.json, or it cannot push the release
      # tag. Merging that PR publishes all five crates.
      #
      # The release PR is not held: `release-pr` keeps it current on every push to main,
      # so the release that lifting the hold would publish is always visible for review.
      use-release-plz: false
      publish-crate: false

      # The root Cargo.toml is a virtual manifest with no [package], so the msrv job has no
      # package rust-version to read by default (it would fail: "No msrv input and no
      # rust-version in Cargo.toml"). The stack's one MSRV is [workspace.package]'s
      # rust-version, which every crate inherits; keep this input equal to it.
      msrv: '1.91'

      # Empty: the whole workspace. The same input scopes both cargo-semver-checks and the
      # PR publish dry run. For the dry run, the whole workspace is the only scope that
      # works: a bare `cargo publish --dry-run` at this virtual root packages all five
      # crates together, which is how the in-workspace `^0.7.0` requirements resolve before
      # any of them is on crates.io. A single crate cannot be dry-run on its own here, and
      # a list cannot be passed at all -- rust-ci.yml hands the value to one `--package`,
      # and cargo rejects `a,b` as a package name.
      package: ''

      # Off until 0.7.0 is on crates.io. uds_session, uds_services and uds_on_ip have no
      # published baseline to diff against. Re-enable, with `package` still empty,
      # in the first change after 0.7.0 is published, so every later release is checked
      # across the whole stack.
      run-semver-checks: false

      # This workspace's proptest suites are `proptest!` blocks inside lib code, not a
      # separate integration-test target, so excluding them from the coverage job would
      # understate coverage. Deliberately overlapping rather than disjoint: the property
      # job re-runs the same tests under their own name for a readable signal.
      unit-test-filter: 'all()'
      property-test-filter: 'test(~prop_)'

      # thumbv7em-none-eabihf, not the workflow's thumbv6m-none-eabi default: it is the
      # target the justfile's own `embedded_target` names and the one the previous
      # hand-rolled `embedded` job checked against (AURIX TC4x stand-in).
      no-std-target: thumbv7em-none-eabihf

      # See the module comment above: the reusable workflow cannot reach either fuzz
      # target in this layout.
      run-fuzz-tests: false

      comprehensive-tests: ${{ inputs.enable-comprehensive-tests || false }}

  # ===================================================================================
  # Fuzz Tests (hand-rolled: the reusable workflow's fuzz-tests job cannot reach these)
  # ===================================================================================
  # Each job mirrors rust-ci.yml's own fuzz-tests job (nightly toolchain, cargo-fuzz,
  # bounded run time, artifacts-on-failure) but scoped to one crate's fuzz/ directory.
  fuzz-uds-protocol:
    name: Fuzz Tests (uds_protocol)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: crates/uds_protocol
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master 2026-07-14
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/uds_protocol/fuzz
      - name: Install cargo-fuzz
        uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: cargo-fuzz
      - name: Build fuzz targets
        run: cargo fuzz build
      - name: Run fuzz targets
        shell: bash
        env:
          COMPREHENSIVE: >-
            ${{ inputs.enable-comprehensive-tests
                || github.event_name == 'schedule'
                || github.event_name == 'merge_group'
                || (github.event_name == 'push' && github.ref_name == 'main') }}
        run: |
          max_time=6
          if [[ "$COMPREHENSIVE" == "true" ]]; then
            max_time=600
          fi
          for target in $(cargo fuzz list); do
            cargo fuzz run "$target" -- -max_total_time="$max_time"
          done
      - name: Upload fuzz artifacts on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-artifacts-uds_protocol
          path: crates/uds_protocol/fuzz/artifacts/
          retention-days: 30

  fuzz-simple-doip:
    name: Fuzz Tests (simple_doip)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: crates/simple_doip
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master 2026-07-14
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/simple_doip/fuzz
      - name: Install cargo-fuzz
        uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: cargo-fuzz
      - name: Build fuzz targets
        run: cargo fuzz build
      - name: Run fuzz targets
        shell: bash
        env:
          COMPREHENSIVE: >-
            ${{ inputs.enable-comprehensive-tests
                || github.event_name == 'schedule'
                || github.event_name == 'merge_group'
                || (github.event_name == 'push' && github.ref_name == 'main') }}
        run: |
          max_time=6
          if [[ "$COMPREHENSIVE" == "true" ]]; then
            max_time=600
          fi
          for target in $(cargo fuzz list); do
            cargo fuzz run "$target" -- -max_total_time="$max_time"
          done
      - name: Upload fuzz artifacts on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-artifacts-simple_doip
          path: crates/simple_doip/fuzz/artifacts/
          retention-days: 30

  # ===================================================================================
  # Miri (hand-rolled: the reusable workflow's Miri job builds default features only)
  # ===================================================================================
  # Every test behind simple_doip's `connection` feature is skipped by rust-ci.yml's
  # Miri job. These run on the mock stack, so Miri can interpret them; the tests on real
  # sockets (entity_std, entity_interop, tester_interop, tester_late_ack) cannot be.
  # Tree borrows, because stacked borrows rejects embassy-futures' select_array, which
  # tree borrows accepts. See `just miri`.
  miri-connection:
    name: Miri (simple_doip connection)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master 2026-07-14
        with:
          toolchain: nightly
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: Run the connection tests under Miri
        env:
          MIRIFLAGS: -Zmiri-tree-borrows
        run: >-
          cargo miri test -p simple_doip --features connection
          --lib --test tester --test entity --test entity_cancel --test mock_stack

  # ===================================================================================
  # Embedded (hand-rolled: the reusable workflow checks default members on the host)
  # ===================================================================================
  # rust-ci.yml runs bare cargo at the root, which builds default members only, so it
  # never builds examples/embassy-net-entity, and its no_std canary never builds
  # simple_doip's `connection` feature. `just embedded` builds every no_std crate for
  # bare metal, the adapter among them. On the MSRV: the adapter is what sets it.
  embedded:
    name: Embedded build (thumbv7em-none-eabihf, MSRV)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Stable lints and documents: clippy at the MSRV does not know every lint the
      # workspace configures.
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master 2026-07-14
        with:
          toolchain: stable
          targets: thumbv7em-none-eabihf
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Lint the embassy-net adapter
        run: >-
          cargo +stable clippy -p embassy-net-entity --target thumbv7em-none-eabihf
          -- -D warnings
      - name: Document the embassy-net adapter
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links -D warnings
        run: >-
          cargo +stable doc -p embassy-net-entity --target thumbv7em-none-eabihf
          --no-deps
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master 2026-07-14
        with:
          toolchain: '1.91'
          targets: thumbv7em-none-eabihf
      - name: Build the no_std crates for bare metal at the MSRV
        run: just embedded

  # ===================================================================================
  # Release PR (hand-rolled: the reusable one cannot run while releases are held)
  # ===================================================================================
  # rust-ci.yml has one switch for both release-plz jobs. use-release-plz turns on the
  # release PR and the release together, and the release publishes every version not
  # yet on crates.io, so the first push to main would publish 0.7.0. This job is
  # rust-ci.yml's release-plz-pr alone: it opens and updates the release PR and never
  # publishes, tags or cuts a GitHub release. It has no registry token to do so.
  #
  # The App token is required, not preferred. A pull request opened with github.token
  # triggers no workflows, so the release PR would have no checks and could never
  # pass the rules on main. Until the App's secrets exist, the job does nothing and
  # says so in a notice, rather than opening a PR that can never merge or failing
  # every push to main.
  release-pr:
    name: Release PR
    if: >-
      ${{
        github.event_name == 'push'
        && github.ref == 'refs/heads/main'
        && github.repository == 'luminartech/uds_stack'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: release-pr
      cancel-in-progress: false
    env:
      HAS_RELEASE_PLZ_APP: ${{ secrets.RELEASE_PLZ_APP_ID != '' && secrets.RELEASE_PLZ_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Skip without the release-plz App
        if: ${{ env.HAS_RELEASE_PLZ_APP != 'true' }}
        run: >-
          echo "::notice title=Release PR not updated::RELEASE_PLZ_APP_ID and
          RELEASE_PLZ_APP_PRIVATE_KEY are not set, so the release PR was left as it is."
      - name: Mint release-plz App token
        id: app-token
        if: ${{ env.HAS_RELEASE_PLZ_APP == 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # release-plz pushes the release PR's branch with the checked-out credentials, so
      # this checkout persists them.
      - uses: actions/checkout@v7 # zizmor: ignore[artipacked]
        if: ${{ env.HAS_RELEASE_PLZ_APP == 'true' }}
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master 2026-07-14
        if: ${{ env.HAS_RELEASE_PLZ_APP == 'true' }}
        with:
          toolchain: stable
      - name: Run release-plz release-pr
        if: ${{ env.HAS_RELEASE_PLZ_APP == 'true' }}
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
