# Not published: the sensor's whole server path assembled as bare-metal firmware, so that
# `just embedded` builds what the sensor links and `just size` measures it. Every
# dependency is the bare-metal build's; on a host the binary is empty.
[package]
name = "embedded-probe"
version = "0.0.0"
edition = "2024"
rust-version.workspace = true
publish = false
description = "uds_server! over DoIpTransport over Entity, linked for bare metal, no alloc"
license = "MIT OR Apache-2.0"

[target.'cfg(target_os = "none")'.dependencies]
simple_doip = { workspace = true, features = ["connection"] }
uds_on_ip = { path = "../../crates/uds_on_ip" }
uds_services = { workspace = true }
edge-nal = { workspace = true }
embedded-io-async = { workspace = true }
embassy-futures = { workspace = true }
embassy-time = { workspace = true, features = ["tick-hz-1_000"] }
embassy-time-driver = { workspace = true }
embassy-time-queue-utils = { workspace = true, features = ["generic-queue-8"] }
critical-section = { workspace = true }
static_cell = { workspace = true }
# static_cell's atomics, through the critical section on a core without compare-and-swap
# (thumbv6m); native where the core has it.
portable-atomic = { workspace = true, features = ["critical-section"] }
cortex-m = { workspace = true, features = ["critical-section-single-core"] }
cortex-m-rt = { workspace = true }

[lints]
workspace = true
