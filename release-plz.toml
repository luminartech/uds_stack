# Lockstep. The six crates are one stack and release as one: every release publishes all
# six at the same version, which lives once, in the root Cargo.toml's [workspace.package].
# A shared field rather than release-plz's `version_group`, because a version group only
# moves the members that changed, and an untouched member would be left behind.
[workspace]
# Each crate keeps its own CHANGELOG.md, written by hand under `## [Unreleased]`; that is
# what a crates.io or docs.rs reader of one crate sees. release-plz does not touch them:
# generating would put a commit list above the curated text, with other crates' commits
# mixed in, because the crates share one history. The release PR retitles each
# `## [Unreleased]` to `## [<version>] — <date>` by hand.
changelog_update = false

# One tag and one GitHub release per version, both on the anchor package below, never one
# per crate.
git_tag_enable = false
git_release_enable = false

# The anchor. release-plz releases packages one at a time in dependency order and tags each
# as soon as it is published, so the tag has to sit on the crate that is always published
# last, or `v<version>` could exist over a partial release. uds_c is the only crate that
# depends on uds_on_ip, which depends on all four others. That is publish order, not
# architecture: uds_c binds C firmware to the stack, and uds_on_ip depends on
# uds_services because it implements uds_services' transport trait.
[[package]]
name = "uds_c"
git_tag_enable = true
git_tag_name = "v{{ version }}"
git_release_enable = true
# The release is the stack's, so it is named for the stack. The body links each crate's
# entry rather than quoting one: with `changelog_update = false`, release-plz renders
# `{{ changelog }}` empty.
git_release_name = "uds_stack v{{ version }}"
git_release_body = """
All six crates released together at {{ version }}. Each crate's changelog has its own
entry for this version:

- uds_protocol: [crate](https://crates.io/crates/uds_protocol/{{ version }}), [changes](https://github.com/luminartech/uds_stack/blob/v{{ version }}/crates/uds_protocol/CHANGELOG.md)
- uds_session: [crate](https://crates.io/crates/uds_session/{{ version }}), [changes](https://github.com/luminartech/uds_stack/blob/v{{ version }}/crates/uds_session/CHANGELOG.md)
- uds_services: [crate](https://crates.io/crates/uds_services/{{ version }}), [changes](https://github.com/luminartech/uds_stack/blob/v{{ version }}/crates/uds_services/CHANGELOG.md)
- simple_doip: [crate](https://crates.io/crates/simple_doip/{{ version }}), [changes](https://github.com/luminartech/uds_stack/blob/v{{ version }}/crates/simple_doip/CHANGELOG.md)
- uds_on_ip: [crate](https://crates.io/crates/uds_on_ip/{{ version }}), [changes](https://github.com/luminartech/uds_stack/blob/v{{ version }}/crates/uds_on_ip/CHANGELOG.md)
- uds_c: [crate](https://crates.io/crates/uds_c/{{ version }}), [changes](https://github.com/luminartech/uds_stack/blob/v{{ version }}/crates/uds_c/CHANGELOG.md)
"""
