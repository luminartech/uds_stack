[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Unicode-3.0",
]
# embassy-net's TCP/IP stack, which only the embassy-net entity adapter brings in.
exceptions = [
  { crate = "smoltcp", allow = ["0BSD"] },
  { crate = "managed", allow = ["0BSD"] },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[advisories]
yanked = "warn"
# cortex-m, which only the embedded probe brings in. No release of it is without
# bare-metal; when one is, cargo-deny reports this entry as unused.
ignore = [
  { id = "RUSTSEC-2026-0110", reason = "bare-metal is unmaintained, not vulnerable; only cortex-m 0.7 pulls it in, for the unpublished embedded probe" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
