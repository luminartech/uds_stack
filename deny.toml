[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Unicode-3.0",
]
# embassy-net's TCP/IP stack, which only the embassy-net entity adapter brings in.
exceptions = [
  { crate = "smoltcp", allow = ["0BSD"] },
  { crate = "managed", allow = ["0BSD"] },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[advisories]
yanked = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
